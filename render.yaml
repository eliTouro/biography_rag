# Render Blueprint: Render -> New -> Blueprint -> pick this repo.
# No secret is stored here: `sync: false` makes Render ask for the value in the dashboard.
services:
  - type: web
    name: biography-rag
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: CHAT_MODEL
        value: gpt-5.4-mini
      - key: EMBED_MODEL
        value: text-embedding-3-small
      - key: DAILY_BUDGET_USD
        value: "3"
